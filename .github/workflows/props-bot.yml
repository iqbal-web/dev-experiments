name: Props Bot

on:
  # Automatically adds contributor credits to merged PRs
  pull_request_target:
    types:
      - labeled
      - closed

# Only allow minimal permissions
permissions:
  pull-requests: write
  issues: write

jobs:
  props:
    name: Add Contributor Props
    runs-on: ubuntu-latest
    if: >
      github.event.action == 'labeled' &&
      github.event.label.name == 'props-bot' &&
      github.event.pull_request.merged == true
    
    steps:
      - name: Add contributor comment
        uses: actions/github-script@v7
        with:
          script: |
            const prAuthor = context.payload.pull_request.user.login;
            const prNumber = context.payload.pull_request.number;
            const body = `🎉 Thank you @${prAuthor} for your contribution to Dev Experiments!\n\nYour changes have been merged and will be included in the next release.`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });
