name: PR Playground Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Create plugin ZIP
        run: npm run plugin-zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-experiments-plugin
          path: dev-experiments.zip

  expose-build:
    name: Expose Built Artifact
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      artifact-url: ${{ steps.expose.outputs.artifact-url }}
    steps:
      - name: Expose built artifact
        id: expose
        uses: WordPress/action-wp-playground-pr-preview/.github/actions/expose-artifact-on-public-url@v2
        with:
          artifact-name: 'dev-experiments-plugin'
          artifact-filename: 'dev-experiments.zip'
          pr-number: ${{ github.event.pull_request.number }}
          commit-sha: ${{ github.sha }}
          artifacts-to-keep: '2'

  create-blueprint:
    name: Create Blueprint
    needs: expose-build
    runs-on: ubuntu-latest
    outputs:
      blueprint: ${{ steps.blueprint.outputs.result }}
    steps:
      - name: Create Blueprint
        id: blueprint
        uses: actions/github-script@v7
        with:
          script: |
            const blueprint = {
              steps: [{
                step: "installPlugin",
                pluginZipFile: {
                  resource: "url",
                  url: "${{ needs.expose-build.outputs.artifact-url }}"
                }
              }]
            };
            return JSON.stringify(blueprint);
          result-encoding: string

  preview:
    name: Post Preview Button
    needs: create-blueprint
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post Playground preview button
        uses: WordPress/action-wp-playground-pr-preview@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          blueprint: ${{ needs.create-blueprint.outputs.blueprint }}
          mode: 'append-to-description'