name: Build and Test

on:
  push:
    branches: [ main, trunk, develop ]
  pull_request:
    branches: [ main, trunk, develop ]

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linting (JavaScript)
      run: npm run lint:js
    
    - name: Run linting (CSS)
      run: npm run lint:css
    
    - name: Build plugin
      run: npm run build
    
    - name: Check build output
      run: |
        if [ ! -d "build" ]; then
          echo "Build directory not found!"
          exit 1
        fi
        if [ ! -f "build/index.js" ]; then
          echo "Build output missing index.js!"
          exit 1
        fi
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v5
      with:
        name: build-${{ matrix.node-version }}
        path: build/
        retention-days: 7

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run unit tests
      run: npm run test:unit
      continue-on-error: true

  phpcs:
    name: PHP Code Standards
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        tools: composer, cs2pr
    
    - name: Get Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
    
    - name: Setup Composer cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-
    
    - name: Install Composer dependencies
      run: |
        composer require --dev wp-coding-standards/wpcs --no-interaction
        composer require --dev phpcompatibility/phpcompatibility-wp --no-interaction
        composer require --dev dealerdirect/phpcodesniffer-composer-installer --no-interaction
    
    - name: Run PHPCS
      run: |
        vendor/bin/phpcs --standard=phpcs.xml.dist --report=checkstyle | cs2pr
      continue-on-error: true

  package:
    name: Create Distribution Package
    runs-on: ubuntu-latest
    needs: [build, test, phpcs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build plugin
      run: npm run build
    
    - name: Create plugin ZIP
      run: npm run plugin-zip
    
    - name: Upload distribution package
      uses: actions/upload-artifact@v5
      with:
        name: dev-experiments-plugin
        path: dev-experiments.zip
        retention-days: 30
